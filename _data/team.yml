- name: Anna Czarkwiani
  position: Group Leader
  description: Anna became the head of the Junior Research Group for Biomineralization, Gravity Sensing and Regeneration at the Center for Regenerative Therapies Dresden (CRTD) at the Technische Universitat Dresden in February 2026. Before she did her postdoctoral training at CRTD and her PhD at University College London in the UK. She loves learning about the biology of weird animals and strives to build a fun, respectful and transparent lab valuing team work and accountability. In her free time she enjoys hanging out with her Husband and two kids, playing video games, reading books and low-commitment sports.
  image: PI_photo_square.JPG

- name: Ankit Mazumdar
  position: PhD Researcher
  description: Ankit is joining the group as a PhD researcher in November 2026. He completed his first master’s in Biotechnology at KIIT University in India and his second in Molecular Bioengineering at TU Dresden. He enjoys combining ideas from biomaterials and animal biology and has worked previously as a research scientist at Fraunhofer IKTS, developing anti-calcification treatments for bioprosthetic heart valves. His PhD will focus on otoconia regeneration in the axolotl, investigating mineral restoration following removal and injury. These tiny mineral structures help animals sense gravity and maintain balance. Outside the lab, he enjoys cooking, playing badminton and cycling along the Elbe, where his route planning is strongly influenced by cafés serving carrot cake. He is also a huge Liverpool FC fan, so he already has some experience with patience, optimism and occasionally questioning everything.
  image: Axolotl_drawing_AP_2.png

